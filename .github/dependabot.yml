version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - expo
          - "expo-*"
          - "@expo/*"
          - eslint-config-expo
          - react
          - react-dom
          - "react-native*"
          - "@types/react"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "expo-*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "@expo/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: eslint-config-expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "react-native*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
